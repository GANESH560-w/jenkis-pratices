<!DOCTYPE html>
<html>
<head>
    <title>My Website - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        /* Navbar */
        .navbar {
            background: #1e3c72;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .navbar ul {
            list-style: none;
            display: flex;
        }

        .navbar ul li {
            margin-left: 20px;
        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .navbar ul li a:hover {
            color: #ffd700;
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            background: linear-gradient(to right, #2a5298, #1e3c72);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            flex-direction: column;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .hero button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #ffd700;
            cursor: pointer;
            font-weight: bold;
        }

        .hero button:hover {
            background: #ffcc00;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background: #1e3c72;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>MyWebsite</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Welcome to My Website</h1>
        <p>Build modern websites with HTML, CSS and JavaScript</p>
        <button onclick="showMessage()">Get Started</button>
    </div>

    <!-- Footer -->
    <footer>
        © 2026 MyWebsite | All Rights Reserved
    </footer>

    <script>
        function showMessage() {
            alert("Welcome! Let's start building 🚀");
        }
    </script>

</body>
</html>
